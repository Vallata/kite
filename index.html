<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kite Gironde</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kite">
<meta name="theme-color" content="#14212B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --ground:#F4F1EA; --ink:#14212B; --muted:#4A5560; --line:#E2DCCF; --night:#14212B; --night-2:#22323E; --accent:#E4572E; --ok:#0E7C66; --danger:#C8102E; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--ground); color:var(--ink); }
body { font-family:"IBM Plex Sans", system-ui, sans-serif; font-variant-numeric:tabular-nums; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.app { max-width:720px; margin:0 auto; padding:20px 14px 32px; display:flex; flex-direction:column; gap:16px; }
h1, h2, h3 { font-family:"Bricolage Grotesque", Georgia, serif; margin:0; }
.top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.top h1 { font-size:26px; font-weight:800; letter-spacing:-0.5px; }
.meta { margin:2px 0 0; font-size:12px; color:var(--muted); }
.refresh { width:44px; height:44px; border-radius:22px; border:1px solid #C9C2B3; background:#fff; color:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; }
.mode { width:100%; min-height:52px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; border-radius:14px; border:2px solid #C9C2B3; background:#fff; font:inherit; color:var(--ink); text-align:left; cursor:pointer; }
.mode-text { display:flex; flex-direction:column; gap:2px; }
.mode-title { font-size:14px; font-weight:600; }
.mode-rule { font-size:11px; color:#3A4550; }
.switch { width:46px; height:26px; border-radius:13px; background:#9AA3AA; padding:3px; display:flex; flex-shrink:0; }
.knob { width:20px; height:20px; border-radius:10px; background:#fff; }
.mode-on { background:#FDE7E2; border-color:var(--danger); }
.mode-on .switch { background:var(--danger); justify-content:flex-end; }
.mode:focus-visible, .refresh:focus-visible { outline:3px solid #1E6FD9; outline-offset:2px; }
.best { background:var(--night); color:var(--ground); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:12px; }
.best-kicker { margin:0; font-size:12px; font-weight:600; color:#F2B38F; }
.best h2 { font-size:34px; font-weight:800; line-height:1; }
.best-window { margin:0; font-size:15px; font-weight:500; }
.best-stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.best-stats div { background:var(--night-2); border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:2px; }
.best-stats span { font-size:10px; color:#B8C2CA; }
.best-stats strong { font-size:18px; font-weight:600; }
.ranking { list-style:none; margin:0; padding:12px 0 0; border-top:1px solid #2E404D; display:flex; flex-direction:column; gap:8px; }
.ranking li { display:flex; align-items:center; gap:10px; font-size:13px; }
.rank { width:14px; color:#B8C2CA; font-size:12px; }
.rname { width:96px; font-weight:500; }
.rwin { flex:1; text-align:right; color:#D8DEE3; font-size:12px; }
.ranking li.first .rwin { color:#F2B38F; font-weight:600; }
.spot { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 0 10px; display:flex; flex-direction:column; gap:10px; }
.spot-head { display:flex; justify-content:space-between; align-items:center; padding:0 14px; }
.spot-head h3 { font-size:20px; font-weight:700; }
.chip { padding:6px 10px; border-radius:999px; background:#EFEBE3; font-size:12px; font-weight:600; }
.chip-best { background:var(--accent); }
.table { display:flex; overflow-x:auto; font-size:12px; -webkit-overflow-scrolling:touch; }
.labels { position:sticky; left:0; z-index:1; background:#fff; width:66px; flex-shrink:0; padding-left:10px; border-right:1px solid #EDE8DD; color:var(--muted); font-size:10px; }
.labels > div, .col > div { height:24px; display:flex; align-items:center; }
.labels .c-time, .col .c-time { height:36px; }
.lab-safe { font-weight:600; color:var(--ink); }
.col { width:34px; flex-shrink:0; }
.col > div { justify-content:center; }
.col.newday { border-left:2px solid var(--ink); }
.col .c-time { flex-direction:column; line-height:1.15; }
.c-time .d { font-size:10px; font-weight:600; color:#0E5A74; white-space:nowrap; align-self:flex-start; padding-left:3px; height:13px; }
.c-time .h { font-size:11px; }
.num { font-weight:600; }
.small { font-size:10px; }
.rain { color:#1E4FA0; }
.stars { color:#C99500; font-size:10px; letter-spacing:-1px; }
.stars.blue { color:#1E6FD9; }
.safe { width:28px; height:18px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:11px; font-style:normal; }
.safe-ok { background:var(--ok); } .safe-danger { background:var(--danger); } .safe-none, .safe-short { background:var(--line); } .safe-unknown { background:#8A96A0; }
.note { margin:0; padding:0 14px; font-size:11px; color:var(--muted); }
.col-arpege > div:not(.c-time) { filter:saturate(0.35); }
.col-arpege .c-time { background:#ECE7DC; }
.col.arp-start { border-left:2px dashed #8A96A0; }
.legend { display:flex; flex-wrap:wrap; gap:10px 14px; font-size:11px; color:#3A4550; padding:0 4px; }
.legend span { display:flex; align-items:center; gap:6px; }
.legend .safe { width:14px; height:10px; border-radius:3px; }
.error { background:#fff; border:2px solid var(--danger); border-radius:14px; padding:14px; }
.error p { margin:0 0 8px; }
.loading { color:var(--muted); font-size:14px; padding:20px 4px; }

.verdict { margin:0; font-size:13px; font-weight:700; display:inline-flex; align-self:flex-start; padding:4px 10px; border-radius:999px; }
.v-yes { background:#0E7C66; color:#fff; } .v-maybe { background:#F2B38F; color:#14212B; } .v-no { background:#C8102E; color:#fff; }
.plan { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 12px 12px; display:flex; flex-direction:column; gap:12px; }
.plan-head { display:flex; justify-content:space-between; align-items:baseline; }
.plan-head h2 { font-size:18px; font-weight:700; }
.plan-sub { font-size:11px; color:var(--muted); }
.plan-day { display:flex; flex-direction:column; gap:4px; }
.plan-date { font-size:13px; font-weight:600; }
.plan-arp { font-size:10px; font-weight:500; color:var(--muted); background:#ECE7DC; padding:1px 6px; border-radius:6px; margin-left:4px; }
.plan-row { display:flex; align-items:center; gap:6px; text-decoration:none; color:var(--ink); min-height:26px; }
.plan-name { width:78px; flex-shrink:0; font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.plan-cells { flex:1; display:grid; grid-template-columns:repeat(13, minmax(0,1fr)); gap:2px; }
.plan-ticks { min-height:14px; }
.tick { font-size:9px; color:var(--muted); text-align:left; white-space:nowrap; }
.pc { height:24px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; }
.pc-ok { background:var(--ok); color:#fff; }
.pc-danger { background:var(--danger); color:#fff; }
.pc-none, .pc-unknown, .pc-short { background:#EFEBE3; color:#6B747C; }
.pc-past { background:transparent; }
.pc-arp { background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 3px, transparent 3px 6px); }
.pc-ok.pc-arp { background-color:#4E9C8C; color:#fff; }
.pc-danger.pc-arp { background-color:#D9536A; color:#fff; }
.spot-sub { font-size:11px; color:var(--muted); }
.spot-head { gap:8px; }
.chip { white-space:nowrap; }

.best-when { margin:0; font-size:18px; font-weight:600; }
.best-wind { margin:0; font-size:14px; color:#D8DEE3; }
.best-wind strong { font-size:22px; color:#F4F1EA; }
.sessions { display:flex; flex-direction:column; gap:8px; }
.sessions h2 { font-size:18px; font-weight:700; }
.sess-note { font-family:"IBM Plex Sans", system-ui, sans-serif; font-size:12px; font-weight:400; color:var(--muted); }
.sessions ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.sessions li { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 14px; }
.sessions li.sess-best { border:2px solid var(--ok); }
.sessions li.sess-arp { background:#F7F4EE; border-style:dashed; }
.sess-day { width:40px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; font-size:11px; color:var(--muted); line-height:1.1; }
.sess-day b { font-size:20px; color:var(--ink); font-weight:700; }
.sess-main { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
.sess-spot { font-weight:600; font-size:15px; }
.sess-hours { font-size:13px; color:#3A4550; }
.sess-wind { display:flex; flex-direction:column; align-items:flex-end; font-size:12px; color:var(--muted); }
.sess-w { white-space:nowrap; }
.sess-wind b { font-size:22px; color:var(--ok); font-weight:700; line-height:1; }
.sess-arp .sess-wind b { color:#5F6B74; }
.sess-wind small { font-size:11px; }
.detail-title { margin:10px 0 -6px; font-size:12px; font-weight:600; color:var(--muted); padding:0 4px; }
details.spot { padding:0; gap:0; }
details.spot[open] > .table { margin-top:8px; }
details.spot[open] > .note { margin-top:8px; }
details.spot > summary { list-style:none; cursor:pointer; padding:14px; }
details.spot > summary::-webkit-details-marker { display:none; }
details.spot[open] > summary { padding-bottom:4px; }
details.spot[open] { padding-bottom:10px; }
.spot-name { display:flex; flex-direction:column; gap:2px; }
.chev { width:10px; height:10px; border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); transform:rotate(45deg); margin-right:4px; flex-shrink:0; }
details[open] .chev { transform:rotate(-135deg); }
summary:focus-visible { outline:3px solid #1E6FD9; outline-offset:-3px; border-radius:16px; }

/* ---- finitions ---- */
.app { gap:20px; padding:24px 16px 40px; }
.top h1 { font-size:28px; }
.meta { margin-top:4px; line-height:1.4; }
.mode { padding:14px 16px; border-width:1px; }
.mode-title { font-size:15px; }
.mode-rule { font-size:12px; line-height:1.4; }
.best { padding:22px 20px 24px; gap:0; border-radius:20px; }
.verdict { font-size:16px; padding:7px 16px 7px 12px; gap:8px; align-items:center; margin-bottom:16px; letter-spacing:.2px; }
.v-dot { width:8px; height:8px; border-radius:4px; background:currentColor; opacity:.85; }
.best h2 { font-size:40px; letter-spacing:-0.5px; margin-bottom:12px; }
.best-when { font-size:19px; margin-bottom:14px; }
.best-wind { font-size:14px; line-height:1.3; padding-top:14px; border-top:1px solid #2E404D; }
.best-wind strong { font-size:28px; margin-right:2px; }
.sessions { gap:10px; margin-top:8px; }
.sessions h2 { font-size:20px; }
.sessions li { padding:12px 16px; }
.detail { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
.detail-title { margin:0; padding:0 4px; font-size:12px; font-weight:600; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); }
.spots { display:flex; flex-direction:column; gap:10px; }
details.spot > summary { padding:16px 18px; }
.spot-head h3 { font-size:21px; }
.spot-name { gap:4px; }
.spot-sub { font-size:13px; }

/* ---- cartes spot ---- */
details.spot > summary { display:flex; flex-direction:column; align-items:flex-start; gap:10px; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
details.spot > summary:focus { outline:none; }
details.spot > summary:focus-visible { outline:none; box-shadow:inset 0 0 0 2px #1E6FD9; border-radius:16px; }
.spot-top { width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; }
.spot-top h3 { font-size:21px; font-weight:700; }
.sst { display:flex; align-items:center; gap:8px; width:100%; border-radius:12px; padding:10px 12px; font-size:15px; font-weight:600; box-sizing:border-box; }
.sst-ok { background:#E2F1EC; color:#0B5E4E; }
.sst-maybe { background:#FBEBDD; color:#8A4B12; }
.sst-no { background:#F1EEE7; color:#6B747C; font-weight:500; }
.sst .v-dot { flex-shrink:0; }
.sst-when { flex:1; }
.sst-wind { font-size:15px; font-weight:700; white-space:nowrap; }
.sst-more { font-size:12px; color:var(--muted); margin-top:-4px; padding-left:2px; }

.also { margin-top:18px; padding-top:14px; border-top:1px solid #2E404D; display:flex; flex-direction:column; gap:8px; }
.also-title { margin:0; font-size:11px; font-weight:600; letter-spacing:.6px; text-transform:uppercase; color:#B8C2CA; }
.also ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.also li { display:flex; align-items:center; gap:10px; background:var(--night-2); border-radius:10px; padding:10px 12px; font-size:14px; }
.also-spot { font-weight:600; color:#F4F1EA; }
.also-when { color:#D8DEE3; flex:1; }
.also-tag { white-space:nowrap; font-size:11px; color:#B8C2CA; border:1px solid #44586A; border-radius:6px; padding:1px 6px; }
.also-arp { background:transparent; border:1px dashed #44586A; }

.tagline { margin:4px 0 0; font-size:15px; font-weight:600; color:#14212B; }
.k { margin:0 0 10px; font-size:12px; font-weight:600; letter-spacing:.7px; text-transform:uppercase; color:#F2B38F; }

.days { display:flex; flex-direction:column; }
.day { display:flex; gap:12px; padding:12px 0; border-top:1px solid #2E404D; }
.day:first-child { border-top:none; padding-top:4px; }
.day-name { width:62px; flex-shrink:0; font-weight:600; font-size:14px; padding-top:8px; white-space:nowrap; }
.day-ses { flex:1; display:flex; flex-direction:column; gap:6px; }
.ds { display:flex; align-items:center; gap:8px; background:var(--night-2); border-radius:10px; padding:8px 10px; font-size:14px; }
.ds-spot { font-weight:600; white-space:nowrap; }
.ds-h { color:#D8DEE3; flex:1; white-space:nowrap; }
.ds-best { background:#0E7C66; }
.ds-best .ds-h { color:#fff; }
.ds-best .ds-spot { font-size:15px; }
.ds-tag { white-space:nowrap; font-size:11px; font-weight:600; background:#F4F1EA; color:#0B5E4E; border-radius:6px; padding:1px 6px; }
.ds-arp { background:transparent; border:1px dashed #44586A; }
.ds-none { color:#8A96A0; font-size:14px; padding-top:8px; }

.k-q { font-family:"Bricolage Grotesque", Georgia, serif; font-size:26px; font-weight:800; letter-spacing:0; text-transform:none; color:#F4F1EA; margin-bottom:14px; }

.day-name { width:56px; }
.day { gap:10px; }
.ds { flex-wrap:wrap; row-gap:4px; min-width:0; }
.day-ses { min-width:0; }

.tagline { display:block; }
.info { vertical-align:-4px; margin-left:6px; width:22px; height:22px; border-radius:11px; border:1.5px solid #6B747C; background:transparent; color:#4A5560; font:600 13px/1 Georgia, serif; font-style:italic; display:inline-flex; align-items:center; justify-content:center; padding:0; cursor:pointer; flex-shrink:0; position:relative; }
.info::before { content:""; position:absolute; inset:-11px; }

.info:focus-visible { outline:3px solid #1E6FD9; outline-offset:2px; }
.bubble { margin:8px 0 0; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:12px; line-height:1.45; color:#3A4550; box-shadow:0 4px 14px rgba(20,33,43,.08); }
.bubble[hidden] { display:none; }

.modebox { background:#fff; border:1px solid #C9C2B3; border-radius:14px; padding:12px 14px 12px 16px; }
.modebox-on { background:#FDE7E2; border-color:var(--danger); }
.mode-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.mode-title { font-size:15px; font-weight:600; }
.mode-state { font-size:12px; color:#4A5560; }

.switchbtn:focus-visible { outline:3px solid #1E6FD9; outline-offset:2px; border-radius:16px; }
.modebox .bubble { margin-top:10px; box-shadow:none; background:#F7F4EE; display:flex; flex-direction:column; gap:6px; }
.modebox .bubble[hidden] { display:none; }
.help-on { color:#14212B; }
.bubble b { font-weight:600; }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>Kite Gironde</h1>
      <p class="tagline">Où et quand kiter dans les 3 prochains&nbsp;jours<button class="info" id="info" aria-label="Source des prévisions" aria-expanded="false" aria-controls="meta">i</button></p>
      <p class="meta bubble" id="meta" hidden>AROME France HD 0.01°, Météo-France via Open-Meteo</p>
    </div>
    <button class="refresh" id="refresh" aria-label="Actualiser">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>
  <div class="modebox" id="modebox">
    <div class="mode-row">
      <span class="mode-text"><span class="mode-title"><span id="mode-label">Mode débutant</span><button class="info" id="mode-info" aria-label="Explication des modes" aria-expanded="false" aria-controls="mode-help">i</button></span></span>
      <button class="switchbtn" id="mode" role="switch" aria-checked="false" aria-label="Mode pro"><span class="switch"><span class="knob"></span></span></button>
    </div>
    <p class="bubble" id="mode-help" hidden></p>
  </div>
  <div id="content"><p class="loading">Chargement des prévisions…</p></div>
</main>

<script>
/* ===== RÉGLAGES (à modifier ici) ===== */
const CONFIG = {
  // Points de mise à l'eau relevés par Al (lat, lon, altitude en m).
  spots: [
    { name: "Lacanau Lac", lat: 44.9793, lon: -1.0952, alt: 14 },
    { name: "La Hume",     lat: 44.65,   lon: -1.11,   alt: 3 },
    { name: "Sanguinet",   lat: 44.4832, lon: -1.1015, alt: 5 }  // Estey
  ],
  // Seuils des étoiles Windguru (1, 2, 3 étoiles) en noeuds, à recopier de tes préférences Windguru.
  // 11 est déduit de ta capture ; 16 et 21 sont provisoires.
  stars: [11, 16, 21],
  starTempLimit: 10,        // étoiles bleues sous cette température (°C)
  hoursFrom: 9, hoursTo: 21, // seules heures affichées et prises en compte (9h à 21h inclus)
  safety: {
    // minRun : nombre d'heures kitables d'affilée nécessaires pour qu'elles comptent
    // Mode débutant = par défaut ; mode pro = bouton activé
    pro:      { min: 10, max: 35, gustSpread: 10, minRun: 3 },
    beginner: { min: 10, max: 20, gustSpread: 10, minRun: 3 }
  }
};
/* ===================================== */

const HD = "meteofrance_arome_france_hd", FALLBACK = "meteofrance_arome_france", ARPEGE = "meteofrance_arpege_europe";
const HOURLY = ["wind_speed_10m","wind_direction_10m","wind_gusts_10m","temperature_2m","cloud_cover_high","cloud_cover_mid","cloud_cover_low","precipitation","is_day"];
const TTL = 20 * 60 * 1000;
const DAYS = ["Di","Lu","Ma","Me","Je","Ve","Sa"];
const DAYS_LONG = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const DIRS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];
const WIND_SCALE = [[5,"#FFFFFF"],[8,"#CFF6F8"],[10,"#A7F2E6"],[12,"#8CEFB0"],[15,"#6EE86B"],[18,"#B6EE3F"],[21,"#F2E53A"],[23,"#F7B23C"],[26,"#F27A3A"],[31,"#E8453A"]];
const FB_LABEL = { wind_gusts_10m:"rafales", wind_direction_10m:"direction", temperature_2m:"température", cloud_cover_high:"nuages hauts", cloud_cover_mid:"nuages moyens", cloud_cover_low:"nuages bas", precipitation:"pluie", is_day:"jour/nuit" };

function apiUrl() {
  const p = new URLSearchParams({
    latitude: CONFIG.spots.map(s => s.lat).join(","),
    longitude: CONFIG.spots.map(s => s.lon).join(","),
    elevation: CONFIG.spots.map(s => s.alt).join(","),
    hourly: HOURLY.join(","), models: [HD, FALLBACK, ARPEGE].join(","),
    wind_speed_unit: "kn", timezone: "Europe/Paris", forecast_days: "3", cell_selection: "nearest"
  });
  return "https://api.open-meteo.com/v1/meteofrance?" + p.toString();
}

// Open-Meteo suffixe les variables par modèle quand plusieurs modèles sont demandés.
function series(hourly, v, model) {
  return hourly[v + "_" + model] || (model === HD ? hourly[v] : null) || [];
}
const rnd = (x) => (x === null || x === undefined) ? null : Math.round(x);

function parse(results) {
  const list = Array.isArray(results) ? results : [results];
  return list.map((res, idx) => {
    const hourly = res.hourly, fallbacks = [];
    const hours = [];
    hourly.time.forEach((time, i) => {
      const windHd = series(hourly, "wind_speed_10m", HD)[i];
      const src = (windHd === null || windHd === undefined) ? "arpege" : "arome";
      const wind = src === "arome" ? windHd : series(hourly, "wind_speed_10m", ARPEGE)[i];
      if (wind === null || wind === undefined) return; // hors horizon des deux modèles
      const get = (v) => {
        if (src === "arpege") {
          const a = series(hourly, v, ARPEGE)[i];
          return (a === null || a === undefined) ? (v === "is_day" && hourly.is_day ? hourly.is_day[i] : null) : a;
        }
        let x = series(hourly, v, HD)[i];
        if (x === null || x === undefined) {
          x = series(hourly, v, FALLBACK)[i];
          if (x !== null && x !== undefined && !fallbacks.includes(v)) fallbacks.push(v);
        }
        return x === undefined ? null : x;
      };
      const day = get("is_day");
      hours.push({
        time, src, date: time.slice(0, 10), hour: parseInt(time.slice(11, 13), 10),
        wind: Math.round(wind), gust: rnd(get("wind_gusts_10m")), dir: get("wind_direction_10m"),
        temp: rnd(get("temperature_2m")), ch: rnd(get("cloud_cover_high")), cm: rnd(get("cloud_cover_mid")),
        cl: rnd(get("cloud_cover_low")), precip: get("precipitation"), day: day === null ? null : Number(day) === 1
      });
    });
    return { name: CONFIG.spots[idx].name, hours, fallbacks };
  });
}

function makeRules(beginner) {
  const s = beginner ? CONFIG.safety.beginner : CONFIG.safety.pro;
  const r = {
    beginner, min: s.min, max: s.max, spread: s.gustSpread, minRun: s.minRun || 1,
    stars: (h) => CONFIG.stars.filter(t => h.wind >= t).length,
    blue: (h) => h.temp !== null && h.temp < CONFIG.starTempLimit,
    status(h) {
      const b = r.baseStatus(h);
      return (b === "ok" && h.short) ? "short" : b;
    },
    baseStatus(h) {
      if (h.wind > r.max) return "danger";
      if (h.gust !== null && (h.gust - h.wind) > r.spread) return "danger";
      if (h.wind < r.min || h.day === false) return "none";
      if (h.gust === null || h.day === null) return "unknown";
      return "ok";
    },
    overMax: (v) => beginner && v !== null && v > r.max
  };
  return r;
}

function bestWindow(hours, rules, nowKey, src) {
  let best = [], run = [];
  for (const h of hours) {
    if (h.src !== src) { run = []; continue; }
    if (h.time < nowKey || h.hour < CONFIG.hoursFrom || h.hour > CONFIG.hoursTo) continue;
    if (rules.status(h) === "ok") {
      const last = run[run.length - 1];
      run = (last && last.date === h.date && h.hour === last.hour + 1) ? run.concat([h]) : [h];
    } else run = [];
    if (run.length > best.length) best = run.slice();
  }
  return best;
}

function wday(date) { const [y, m, d] = date.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); }
function windowLabel(w, long) {
  if (!w.length) return long ? "Aucun créneau" : "aucun créneau";
  const a = w[0], b = w[w.length - 1];
  const base = (long ? DAYS_LONG : DAYS)[wday(a.date)] + " " + parseInt(a.date.slice(8), 10) + ", " + a.hour + "h à " + (b.hour + 1) + "h";
  if (a.src !== "arpege") return base;
  return base + (long ? " (ARPEGE, à confirmer)" : " · à confirmer");
}
function parisNowKey(date) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23" })
    .formatToParts(date || new Date()).map(x => [x.type, x.value]));
  return p.year + "-" + p.month + "-" + p.day + "T" + p.hour + ":00";
}

// Marque les heures kitables isolées (suite plus courte que minRun) : elles ne comptent pas.
function markShortRuns(hours, rules) {
  let run = [];
  const flush = () => { const short = run.length < rules.minRun; run.forEach(h => { h.short = short; }); run = []; };
  for (const h of hours) {
    h.short = false;
    const inRange = h.hour >= CONFIG.hoursFrom && h.hour <= CONFIG.hoursTo;
    if (inRange && rules.baseStatus(h) === "ok") {
      const last = run[run.length - 1];
      if (last && !(last.date === h.date && h.hour === last.hour + 1 && last.src === h.src)) flush();
      run.push(h);
    } else flush();
  }
  flush();
}

function buildReports(data, rules, nowKey) {
  const spots = data.map(s => {
    markShortRuns(s.hours.filter(h => h.time >= nowKey), rules);
    const wArome = bestWindow(s.hours, rules, nowKey, "arome");
    const w = wArome.length ? wArome : bestWindow(s.hours, rules, nowKey, "arpege");
    const shown = s.hours.filter(h => h.time >= nowKey && h.hour >= CONFIG.hoursFrom && h.hour <= CONFIG.hoursTo);
    return {
      name: s.name, fallbacks: s.fallbacks, hours: shown, window: w, arome: wArome.length > 0,
      avg: w.length ? Math.round(w.reduce((a, h) => a + h.wind, 0) / w.length) : null,
      maxGust: w.length ? Math.max(...w.map(h => h.gust ?? -Infinity)) : null,
      dir: w.length ? w[Math.floor(w.length / 2)].dir : null,
      okHours: shown.filter(h => h.src === "arome" && rules.status(h) === "ok").length,
      hasArpege: shown.some(h => h.src === "arpege")
    };
  });
  // Un créneau AROME passe toujours avant un créneau ARPEGE, moins fiable.
  const ranking = spots.slice().sort((a, b) => (Number(b.arome) - Number(a.arome)) || (b.window.length - a.window.length) || ((b.avg || 0) - (a.avg || 0)));
  return { spots, ranking, best: ranking[0] && ranking[0].window.length ? ranking[0] : null };
}

/* ---------- rendu ---------- */
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function windBg(v, rules) {
  if (v === null) return "transparent";
  if (rules.overMax(v)) return "#C8102E";
  for (const [lim, col] of WIND_SCALE) if (v < lim) return col;
  return "#C93BD1";
}
const windFg = (v, rules) => rules.overMax(v) ? "#FFFFFF" : "#14212B";
function tempBg(t) { if (t === null) return "transparent"; return t < 5 ? "#D8E6F5" : t < 10 ? "#F7EDCB" : t < 15 ? "#F7E3B5" : t < 20 ? "#F6C98A" : t < 24 ? "#F2A868" : t < 27 ? "#EE8A55" : "#E86A45"; }
const cloudBg = (c) => (!c) ? "transparent" : c >= 90 ? "#6F7479" : c >= 50 ? "#A4A8AC" : "#DADCDE";
const cloudFg = (c) => c && c >= 50 ? "#FFFFFF" : "#14212B";
const dirLabel = (d) => d === null ? "–" : DIRS[Math.round((d % 360) / 22.5) % 16];

function sessionsOf(spot, rules) {
  const out = []; let run = [];
  const close = () => {
    if (run.length) {
      const g = run.map(h => h.gust).filter(x => x !== null);
      out.push({ spot: spot.name, date: run[0].date, from: run[0].hour, to: run[run.length - 1].hour + 1, src: run[0].src,
        avg: Math.round(run.reduce((a, h) => a + h.wind, 0) / run.length), gmax: g.length ? Math.max(...g) : null,
        dir: run[Math.floor(run.length / 2)].dir, len: run.length });
    }
    run = [];
  };
  for (const h of spot.hours) {
    if (rules.status(h) === "ok") {
      const last = run[run.length - 1];
      if (last && !(last.date === h.date && h.hour === last.hour + 1 && last.src === h.src)) close();
      run.push(h);
    } else close();
  }
  close();
  return out;
}
const dayShort = (date) => DAYS[wday(date)] + " " + parseInt(date.slice(8), 10);
const dayLong = (date) => DAYS_LONG[wday(date)] + " " + parseInt(date.slice(8), 10);

function render(rep, rules) {
  const all = rep.spots.flatMap(sp => sessionsOf(sp, rules));
  const sure = all.filter(x => x.src === "arome");
  // meilleure session : AROME d'abord, puis la plus longue, puis la plus ventée
  const best = all.slice().sort((x, y) => (Number(y.src === "arome") - Number(x.src === "arome")) || (y.len - x.len) || (y.avg - x.avg))[0];
  let html = '<section class="best">';
  if (best) {
    const dates = [...new Set(all.map(x => x.date))].sort();
    html += '<p class="k k-q">Ça kite ?</p><div class="days">' + dates.map(d => {
      const ses = all.filter(x => x.date === d).sort((x, y) => (y === best) - (x === best) || x.from - y.from);
      return '<div class="day"><span class="day-name">' + DAYS_LONG[wday(d)].slice(0, 3) + '. ' + parseInt(d.slice(8), 10) + '</span><div class="day-ses">' +
        (ses.length ? ses.map(x => '<div class="ds' + (x === best ? ' ds-best' : '') + (x.src === "arpege" ? ' ds-arp' : '') + '"><span class="ds-spot">' + esc(x.spot) + '</span><span class="ds-h">' + x.from + 'h – ' + x.to + 'h</span>' +
          (x === best ? '<span class="ds-tag">le mieux</span>' : x.src === "arpege" ? '<span class="also-tag">à confirmer</span>' : '') + '</div>').join('') : '<span class="ds-none">pas de kite</span>') +
        '</div></div>';
    }).join('') + '</div>';
  } else {
    html += '<p class="k k-q">Ça kite ?</p><h2>Pas de kite</h2><p class="best-when">sur les 3 prochains jours</p><p class="best-wind">Aucun créneau de ' + rules.minRun + ' h à ' + rules.min + ' nds ou plus.</p>';
  }
  html += '</section>';

  html += '<section class="detail"><p class="detail-title">Détail par spot</p><div class="spots">';
  rep.ranking.forEach((s, si) => {
    const ses = sessionsOf(s, rules);
    const nx = ses[0];
    let status;
    if (!s.hours.length) status = '<span class="sst sst-no">Pas de prévision</span>';
    else if (nx) status = '<span class="sst ' + (nx.src === "arome" ? "sst-ok" : "sst-maybe") + '"><span class="v-dot"></span><span class="sst-when">' +
      dayLong(nx.date) + ', ' + nx.from + 'h – ' + nx.to + 'h</span><span class="sst-wind">' + nx.avg + ' nds</span></span>' +
      (nx.src === "arpege" ? '<span class="sst-more">À confirmer (modèle ARPEGE, moins précis)</span>' : '') +
      (ses.length > 1 ? '<span class="sst-more">+ ' + (ses.length - 1) + ' autre' + (ses.length > 2 ? 's' : '') + ' session' + (ses.length > 2 ? 's' : '') + '</span>' : '');
    else status = '<span class="sst sst-no">Pas de session de ' + rules.minRun + ' h</span>';
    html += '<details class="spot"><summary><span class="spot-top"><h3>' + esc(s.name) + '</h3><span class="chev" aria-hidden="true"></span></span>' + status + '</summary>' +
      '<div class="table"><div class="labels"><div class="c-time"></div><div class="lab-safe">Kitable</div><div>Note WG</div><div>Vent</div><div>Rafales</div><div>Dir.</div><div>°C</div><div>Nuages H</div><div>Nuages M</div><div>Nuages B</div><div>Pluie</div></div>';
    let prev = null, prevSrc = null;
    const perDay = {};
    for (const h of s.hours) perDay[h.date] = (perDay[h.date] || 0) + 1;
    for (const h of s.hours) {
      const first = h.date !== prev; prev = h.date;
      const firstArp = h.src === "arpege" && prevSrc !== "arpege"; prevSrc = h.src;
      const st = rules.status(h), n = rules.stars(h);
      html += '<div class="col ' + (first ? "newday " : "") + (h.src === "arpege" ? "col-arpege " : "") + (firstArp && !first ? "arp-start" : "") + '">' +
        '<div class="c-time"><span class="d">' + (first ? DAYS[wday(h.date)] + (perDay[h.date] > 1 ? " " + parseInt(h.date.slice(8), 10) + "." : "") : "") + '</span><span class="h">' + String(h.hour).padStart(2, "0") + 'h</span></div>' +
        '<div><span class="safe safe-' + st + '">' + (st === "danger" ? "!" : st === "unknown" ? "?" : "") + '</span></div>' +
        '<div class="stars ' + (rules.blue(h) ? "blue" : "") + '">' + "★".repeat(n) + '</div>' +
        '<div class="num" style="background:' + windBg(h.wind, rules) + ';color:' + windFg(h.wind, rules) + '">' + h.wind + '</div>' +
        '<div class="num" style="background:' + windBg(h.gust, rules) + ';color:' + windFg(h.gust, rules) + '">' + (h.gust ?? "") + '</div>' +
        '<div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14212B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(' + (((h.dir || 0) + 180) % 360) + 'deg)" aria-label="' + dirLabel(h.dir) + '"><path d="M12 20V4"/><path d="M6 10l6-6 6 6"/></svg></div>' +
        '<div style="background:' + tempBg(h.temp) + '">' + (h.temp ?? "") + '</div>' +
        [h.ch, h.cm, h.cl].map(c => '<div class="small" style="background:' + cloudBg(c) + ';color:' + cloudFg(c) + '">' + (c > 0 ? c : "") + '</div>').join("") +
        '<div class="small rain">' + (h.precip >= 0.1 ? h.precip.toFixed(1) : "") + '</div></div>';
    }
    html += '</div>';
    if (s.hasArpege) html += '<p class="note">Colonnes grisées : modèle ARPEGE 0.1° (environ 11 km), au-delà de l\'horizon AROME HD. Bien moins précis sur les lacs et le Bassin, à prendre comme une tendance.</p>';
    if (s.fallbacks.length) html += '<p class="note">Absent de l\'AROME HD, pris dans l\'AROME 2,5 km : ' + s.fallbacks.map(v => FB_LABEL[v] || v).join(", ") + '.</p>';
    html += '</details>';
  });
  html += '</div></section>';
  return html;
}

/* ---------- données et cache ---------- */
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

async function getData(force) {
  const cached = JSON.parse(load("kite-cache") || "null");
  if (!force && cached && Date.now() - cached.at < TTL && cached.url === apiUrl()) return cached;
  try {
    const res = await fetch(apiUrl());
    const body = await res.json();
    if (!res.ok || body.error) throw new Error(body.reason || ("HTTP " + res.status));
    const fresh = { at: Date.now(), url: apiUrl(), data: parse(body) };
    store("kite-cache", JSON.stringify(fresh));
    return fresh;
  } catch (e) {
    if (cached) return Object.assign({ stale: true, err: e.message }, cached);
    throw e;
  }
}

async function refresh(force) {
  const pro = load("kite-pro") === "1";
  const beginner = !pro;
  const rules = makeRules(beginner);
  const modeBtn = document.getElementById("mode");
  modeBtn.classList.toggle("mode-on", pro);
  modeBtn.setAttribute("aria-checked", String(pro));
  document.getElementById("modebox").classList.toggle("modebox-on", pro);
  document.getElementById("mode-label").textContent = pro ? "Mode pro activé" : "Mode débutant";
  const desc = (c) => c.min + " à " + c.max + " nds, rafales ≤ vent +" + c.gustSpread + ", " + c.minRun + " h d'affilée minimum.";
  document.getElementById("mode-help").innerHTML =
    '<span class="' + (pro ? "" : "help-on") + '"><b>Débutant</b> (par défaut) : ' + desc(CONFIG.safety.beginner) + '</span>' +
    '<span class="' + (pro ? "help-on" : "") + '"><b>Pro</b> : ' + desc(CONFIG.safety.pro) + '</span>' +
    '<span>Dans les deux modes, la direction du vent n\'est pas vérifiée.</span>';
  const content = document.getElementById("content");
  try {
    const d = await getData(force);
    const t = new Date(d.at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" });
    document.getElementById("meta").textContent = "AROME France HD 0.01° (+ ARPEGE au-delà), Météo-France via Open-Meteo, récupéré à " + t + (d.stale ? " (hors ligne)" : "");
    content.innerHTML = render(buildReports(d.data, rules, parisNowKey()), rules);
  } catch (e) {
    content.innerHTML = '<section class="error"><p><strong>Prévisions indisponibles.</strong> ' + esc(e.message) + '</p><p>Vérifie ta connexion puis touche le bouton d\'actualisation.</p></section>';
  }
}

if (typeof document !== "undefined") {
  document.getElementById("refresh").addEventListener("click", () => refresh(true));
  document.getElementById("mode-info").addEventListener("click", (e) => {
    const m = document.getElementById("mode-help"), open = m.hidden;
    m.hidden = !open; e.currentTarget.setAttribute("aria-expanded", String(open));
  });
  document.getElementById("info").addEventListener("click", (e) => {
    const m = document.getElementById("meta"), open = m.hidden;
    m.hidden = !open; e.currentTarget.setAttribute("aria-expanded", String(open));
  });
  document.getElementById("mode").addEventListener("click", () => {
    store("kite-pro", load("kite-pro") === "1" ? "0" : "1");
    refresh(false);
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
  refresh(false);
}
</script>
